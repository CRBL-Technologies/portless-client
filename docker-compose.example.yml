services:
  portless-daemon:
    build: .
    env_file: .env.example
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:43180:43180"
    volumes:
      - portless-data:/var/lib/portless
    depends_on:
      plex:
        condition: service_started

  plex:
    image: nginx:1.27-alpine
    expose:
      - "80"

volumes:
  portless-data:
