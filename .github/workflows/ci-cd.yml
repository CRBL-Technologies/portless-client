name: Client CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Image Changes
    runs-on: ubuntu-latest
    outputs:
      daemon: ${{ steps.filter.outputs.daemon }}
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed image inputs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "daemon=${daemon}" >> "$GITHUB_OUTPUT"
            echo "deploy_config=${deploy_config}" >> "$GITHUB_OUTPUT"
            if [ "$daemon" = "true" ] || [ "$deploy_config" = "true" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          }

          daemon=false
          deploy_config=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            daemon=true
            deploy_config=true
            emit
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
            if [ -z "$base" ] || echo "$base" | grep -Eq '^0+$'; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          git diff --name-only "$base" "$head" > /tmp/changed-files
          while IFS= read -r file; do
            case "$file" in
              .dockerignore|Dockerfile|Dockerfile.package|Cargo.toml|Cargo.lock|src/**)
                daemon=true
                ;;
              .github/scripts/deploy-client-stacks.sh|.github/workflows/ci-cd.yml|.github/workflows/deploy-production.yml)
                deploy_config=true
                ;;
              docker-compose.deploy.yml)
                deploy_config=true
                ;;
            esac
          done < /tmp/changed-files

          emit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.95-daemon-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-daemon-

      - name: Check daemon
        run: |
          cargo fmt -- --check
          cargo test
          cargo clippy -- -D warnings

      - name: Validate compose
        run: docker compose -f docker-compose.example.yml config --quiet

      - name: Test deployment verification
        run: bash .github/scripts/deploy-client-stacks.test.sh

  docker:
    name: Build Daemon Image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.daemon == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache cargo release build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.95-daemon-release-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-daemon-release-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-rust-1.95-daemon-release-

      - name: Build release binary in Bookworm
        run: |
          mkdir -p "$HOME/.cargo" dist
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo \
            -v "$HOME/.cargo:/cargo" \
            -v "$PWD:/src" \
            -w /src \
            rust:1.95-bookworm \
            cargo build --release
          cp target/release/portless-daemon dist/portless-daemon

      - name: Set image tags
        run: |
          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "IMAGE_TAGS<<EOF"
            echo "ghcr.io/${repo_lc}:sha-${GITHUB_SHA}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "ghcr.io/${repo_lc}:latest"
              echo "ghcr.io/${repo_lc}:prod"
            else
              echo "ghcr.io/${repo_lc}:dev"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile.package
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ env.IMAGE_TAGS }}
        run: |
          set -euo pipefail
          images=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            images+=("${tag}@${DIGEST}")
          done <<< "$TAGS"
          for attempt in 1 2 3; do
            if cosign sign --yes "${images[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

  deploy:
    name: Deploy Client
    runs-on: ubuntu-latest
    needs: [test, changes, docker]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_name == 'dev' &&
      vars.STAGING_DEPLOYS_ENABLED != 'false' &&
      needs.test.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@707af61a6c8b4fa7f9476328c035208fba6b54d7 # v2.0.0
        with:
          version: 2.38.0-beta.01

      - name: Deploy client stack
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          PORTLESS_CLIENT_NAS_DEPLOY_API_URL: ${{ vars.PORTLESS_CLIENT_NAS_DEPLOY_API_URL }}
          PORTLESS_CLIENT_NAS_DEPLOY_API_KEY: ${{ secrets.PORTLESS_CLIENT_NAS_DEPLOY_API_KEY }}
          PORTLESS_CLIENT_NAS_STACK_ID: ${{ vars.PORTLESS_CLIENT_NAS_STACK_ID }}
          PORTLESS_CLIENT_NAS_DEPLOY_ENDPOINT_ID: ${{ vars.PORTLESS_CLIENT_NAS_DEPLOY_ENDPOINT_ID }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          DAEMON_CHANGED: ${{ needs.changes.outputs.daemon }}
          DEPLOY_CONFIG_CHANGED: ${{ needs.changes.outputs.deploy_config }}
        run: |
          set -euo pipefail
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
            echo "::error title=1Password token missing::Set OP_SERVICE_ACCOUNT_TOKEN as a GitHub environment secret"
            exit 1
          fi
          if [ -z "${OP_ENVIRONMENT_ID:-}" ]; then
            echo "::error title=1Password environment missing::Set OP_ENVIRONMENT_ID as a GitHub environment variable"
            exit 1
          fi
          op run --environment "$OP_ENVIRONMENT_ID" -- bash .github/scripts/deploy-client-stacks.sh
