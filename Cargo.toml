[package]
name = "portless-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "Elastic-2.0"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
futures-util = "0.3"
portless-contracts = { git = "https://github.com/CRBL-Technologies/portless-contracts", tag = "v1.0.2" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"
x509-parser = "0.16"
tokio-stream = "0.1"
